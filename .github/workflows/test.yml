name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
        python: ["3.9", "3.12", "3.13"]
        fast: ["", "rapidfuzz"]
        exclude:
          - os: windows-latest
            python: "3.9"
          - os: macos-latest
            python: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[test]" ${{ matrix.fast }}
      - run: python -m pytest -q

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . ruff mypy
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy --strict src/ownership_gap

  live:
    # The real lists: fetch, then screen the example file. The example must keep finding its two gaps.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . rapidfuzz
      - run: ownership-gap fetch
      - run: |
          set +e
          ownership-gap screen examples/city_checkbook.csv
          test $? -eq 1
